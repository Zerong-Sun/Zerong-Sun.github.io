name: Deploy site
on:
  push:
    branches: [source]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install archive site dependencies
        working-directory: archive/root-site
        run: |
          cp package.json _deps/package.json
          cd _deps && npm ci --ignore-scripts
          cd ..
          node scripts/link-deps.mjs

      - name: Build archive site
        working-directory: archive/root-site
        run: npm run build

      - name: Install colorblog dependencies
        working-directory: colorblog
        run: npm ci

      - name: Sync shared assets and legacy redirects
        run: |
          node colorblog/scripts/sync-assets.mjs
          node colorblog/scripts/generate-redirects.mjs

      - name: Build and verify colorblog
        working-directory: colorblog
        run: npm run verify

      - name: Merge archive into deploy output
        run: |
          mkdir -p colorblog/dist/archive
          cp -r archive/root-site/dist/. colorblog/dist/archive/
          test -f colorblog/dist/archive/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./colorblog/dist
          publish_branch: main
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
